          \ endpoint = minio_endpoint.split(\"://\", 1)[-1].rstrip(\"/\")\n    client\
          \ = Minio(\n        endpoint,\n        access_key=minio_access_key,\n  \
          \      secret_key=minio_secret_key,\n        session_token=minio_session_token\
          \ or None,\n        secure=secure,\n    )\n    base = f\"kubeflow/{pipeline_name}/{run_id}\"\
          \n\n    uploads = [\n        (lr_model.path, f\"{base}/models/logistic_regression.joblib\"\
          , \"application/octet-stream\"),\n        (rf_model.path, f\"{base}/models/random_forest.joblib\"\
          , \"application/octet-stream\"),\n        (lr_portable_model.path, f\"{base}/models/logistic_regression.json\"\
          , \"application/json\"),\n        (rf_portable_model.path, f\"{base}/models/random_forest.json\"\
          , \"application/json\"),\n        (lr_metrics.path, f\"{base}/metrics/logistic_regression_metrics.json\"\
          , \"application/json\"),\n        (rf_metrics.path, f\"{base}/metrics/random_forest_metrics.json\"\
          , \"application/json\"),\n        (lr_report.path, f\"{base}/reports/logistic_regression_report.html\"\
          , \"text/html\"),\n        (rf_report.path, f\"{base}/reports/random_forest_report.html\"\
