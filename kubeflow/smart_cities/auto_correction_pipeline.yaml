          \ indent=2).encode(\"utf-8\")\n        client.put_object(output_bucket,\
          \ f\"{base}/metadata/{name}\", io.BytesIO(body),\n                     \
          \     len(body), content_type=\"application/json\")\n\n    summary.log_metric(\"\
          best_model_f1\", round(best[\"f1_score\"], 4))\n    summary.metadata[\"\
          best_model\"] = best[\"model_name\"]\n    summary.metadata[\"artifacts_prefix\"\
          ] = run_summary[\"artifacts_prefix\"]\n    print(f\"Best model: {best['model_name']}\
          \ (F1 {best['f1_score']:.4f})\")\n\n"
