# PIPELINE DEFINITION
# Name: smart-cities-auto-correction-classifier
# Description: Smart Cities - Auto-Correction Eligibility Classifier: decides whether a citizen's mistaken application entry can be fixed automatically or needs a human operator. Trains a logistic regression and a random forest on the synthetic IBM2 'obvious mistake' dataset and publishes models, metrics and reports to MinIO.
# Inputs:
#    data_bucket: str [Default: 'smart-cities-data']
#    lr_c: float [Default: 1.0]
#    minio_access_key: str [Default: '']
#    minio_endpoint: str [Default: 's3-minio.humaine-horizon.eu']
#    minio_secret_key: str [Default: '']
#    minio_session_token: str [Default: '']
#    output_bucket: str [Default: 'smart-cities-data']
#    random_state: int [Default: 42.0]
#    rf_max_depth: int [Default: 8.0]
#    rf_n_estimators: int [Default: 200.0]
#    test_object: str [Default: 'auto-correction/test.csv']
#    train_object: str [Default: 'auto-correction/train.csv']
