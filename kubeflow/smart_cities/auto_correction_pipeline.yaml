          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_data(\n    minio_endpoint: str,\n    minio_access_key: str,\n\
          \    minio_secret_key: str,\n    minio_session_token: str,\n    data_bucket:\
          \ str,\n    train_object: str,\n    test_object: str,\n    train_data: Output[Dataset],\n\
          \    test_data: Output[Dataset],\n):\n    \"\"\"Download the train and test\
          \ CSVs from MinIO.\"\"\"\n    import pandas as pd\n    from minio import\
          \ Minio\n\n    if not (minio_access_key and minio_secret_key):\n       \
          \ raise ValueError(\n            \"MinIO credentials are empty. Launch the\
          \ pipeline from the HumAIne Swarm \"\n            \"Assistant, which fills\
          \ them from your session, or pass them explicitly.\"\n        )\n    secure\
          \ = not minio_endpoint.startswith(\"http://\")\n    endpoint = minio_endpoint.split(\"\
          ://\", 1)[-1].rstrip(\"/\")\n    client = Minio(\n        endpoint,\n  \
          \      access_key=minio_access_key,\n        secret_key=minio_secret_key,\n\
          \        session_token=minio_session_token or None,\n        secure=secure,\n\
          \    )\n\n    for obj, artifact in ((train_object, train_data), (test_object,\
          \ test_data)):\n        client.fget_object(data_bucket, obj, artifact.path)\n\
          \        df = pd.read_csv(artifact.path, encoding=\"utf-8\")\n        artifact.metadata.update({\n\
          \            \"source\": f\"s3://{data_bucket}/{obj}\",\n            \"\
          rows\": len(df),\n            \"auto_correctable\": int(df[\"is_obvious\"\
          ].sum()),\n            \"needs_operator\": int((1 - df[\"is_obvious\"]).sum()),\n\
          \        })\n        print(f\"Loaded s3://{data_bucket}/{obj}: {len(df)}\
          \ rows\")\n\n"
