          \    else:\n        # Leaf probability of the positive class; scikit-learn\
          \ averages these over the trees\n        portable[\"trees\"] = [{\n    \
          \        \"left\": t.children_left.tolist(),\n            \"right\": t.children_right.tolist(),\n\
          \            \"feature\": t.feature.tolist(),\n            \"threshold\"\
          : t.threshold.tolist(),\n            \"p\": (t.value[:, 0, 1] / t.value[:,\
          \ 0, :].sum(axis=1)).tolist(),\n        } for t in (est.tree_ for est in\
          \ clf.estimators_)]\n    with open(portable_model.path, \"w\", encoding=\"\
          utf-8\") as fh:\n        json.dump(portable, fh)\n\n    print(f\"Trained\
          \ {model_type} on {len(df)} rows, train accuracy {clf.score(X, y):.4f}\"\
          )\n\n"
        image: python:3.11-slim
    exec-train-model-2:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'scikit-learn==1.5.2'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.15.2' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    train_features: Input[Dataset],\n    model_type:\
          \ str,\n    lr_c: float,\n    rf_n_estimators: int,\n    rf_max_depth: int,\n\
          \    random_state: int,\n    model: Output[Model],\n    portable_model:\
          \ Output[Dataset],\n):\n    \"\"\"Train a logistic regression or a random\
          \ forest on the training features.\n\n    `model` is the scikit-learn object\
          \ (joblib). `portable_model` is the same model as\n    plain JSON numbers\
          \ (scaler and coefficients, or every tree's split arrays), which the\n \
          \   assistant's predict_auto_correction tool evaluates without unpickling\
          \ anything.\n    \"\"\"\n    import json\n\n    import joblib\n    import\
          \ pandas as pd\n    from sklearn.ensemble import RandomForestClassifier\n\
          \    from sklearn.linear_model import LogisticRegression\n    from sklearn.pipeline\
          \ import make_pipeline\n    from sklearn.preprocessing import StandardScaler\n\
          \n    df = pd.read_csv(train_features.path)\n    feature_names = [c for\
          \ c in df.columns if c not in (\"field_type\", \"label\")]\n    X, y = df[feature_names],\
          \ df[\"label\"]\n\n    if model_type == \"logistic_regression\":\n     \
          \   clf = make_pipeline(StandardScaler(), LogisticRegression(C=lr_c, max_iter=1000))\n\
          \        params = {\"C\": lr_c}\n    elif model_type == \"random_forest\"\
          :\n        clf = RandomForestClassifier(n_estimators=rf_n_estimators, max_depth=rf_max_depth,\n\
          \                                     random_state=random_state)\n     \
          \   params = {\"n_estimators\": rf_n_estimators, \"max_depth\": rf_max_depth}\n\
          \    else:\n        raise ValueError(f\"Unknown model_type: {model_type}\"\
          )\n\n    clf.fit(X, y)\n    joblib.dump({\"model\": clf, \"model_type\"\
          : model_type, \"feature_names\": feature_names},\n                model.path)\n\
          \    model.metadata.update({\"model_type\": model_type, \"train_rows\":\
          \ len(df), **params})\n\n    portable = {\n        \"format\": \"humaine-portable-classifier/1\"\
          ,\n        \"model_type\": model_type,\n        \"model_name\": {\"logistic_regression\"\
          : \"Logistic Regression\",\n                       \"random_forest\": \"\
          Random Forest\"}[model_type],\n        \"feature_names\": feature_names,\n\
          \        \"classes\": [\"needs operator\", \"auto-correctable\"],\n    \
          \    \"threshold\": 0.5,\n    }\n    if model_type == \"logistic_regression\"\
          :\n        scaler, lr = clf[0], clf[-1]\n        portable.update({\"scaler_mean\"\
          : scaler.mean_.tolist(), \"scaler_scale\": scaler.scale_.tolist(),\n   \
          \                      \"coef\": lr.coef_[0].tolist(), \"intercept\": float(lr.intercept_[0])})\n\
          \    else:\n        # Leaf probability of the positive class; scikit-learn\
          \ averages these over the trees\n        portable[\"trees\"] = [{\n    \
          \        \"left\": t.children_left.tolist(),\n            \"right\": t.children_right.tolist(),\n\
          \            \"feature\": t.feature.tolist(),\n            \"threshold\"\
          : t.threshold.tolist(),\n            \"p\": (t.value[:, 0, 1] / t.value[:,\
          \ 0, :].sum(axis=1)).tolist(),\n        } for t in (est.tree_ for est in\
          \ clf.estimators_)]\n    with open(portable_model.path, \"w\", encoding=\"\
          utf-8\") as fh:\n        json.dump(portable, fh)\n\n    print(f\"Trained\
          \ {model_type} on {len(df)} rows, train accuracy {clf.score(X, y):.4f}\"\
          )\n\n"
        image: python:3.11-slim
pipelineInfo:
  description: 'Smart Cities - Auto-Correction Eligibility Classifier: decides whether
    a citizen''s mistaken application entry can be fixed automatically or needs a
    human operator. Trains a logistic regression and a random forest on the synthetic
    IBM2 ''obvious mistake'' dataset and publishes models, metrics and reports to
    MinIO.'
  name: smart-cities-auto-correction-classifier
root:
  dag:
    tasks:
      build-features:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-build-features
        dependentTasks:
        - load-data
        inputs:
          artifacts:
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: load-data
            train_data:
              taskOutputArtifact:
                outputArtifactKey: train_data
                producerTask: load-data
        taskInfo:
          name: build-features
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - build-features
        - train-model
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model
            test_features:
              taskOutputArtifact:
                outputArtifactKey: test_features
                producerTask: build-features
        taskInfo:
          name: evaluate-model
      evaluate-model-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model-2
        dependentTasks:
        - build-features
        - train-model-2
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-2
            test_features:
              taskOutputArtifact:
                outputArtifactKey: test_features
                producerTask: build-features
        taskInfo:
          name: evaluate-model-2
      load-data:
        cachingOptions: {}
        componentRef:
          name: comp-load-data
        inputs:
          parameters:
            data_bucket:
              componentInputParameter: data_bucket
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            minio_session_token:
              componentInputParameter: minio_session_token
            test_object:
              componentInputParameter: test_object
            train_object:
              componentInputParameter: train_object
        taskInfo:
          name: load-data
      publish-results:
        cachingOptions: {}
        componentRef:
          name: comp-publish-results
        dependentTasks:
        - evaluate-model
        - evaluate-model-2
        - train-model
        - train-model-2
        inputs:
          artifacts:
            lr_metrics:
              taskOutputArtifact:
                outputArtifactKey: metrics_json
                producerTask: evaluate-model
            lr_model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model
            lr_plots:
              taskOutputArtifact:
                outputArtifactKey: plots
                producerTask: evaluate-model
            lr_portable_model:
              taskOutputArtifact:
                outputArtifactKey: portable_model
                producerTask: train-model
            lr_report:
              taskOutputArtifact:
                outputArtifactKey: report
                producerTask: evaluate-model
            rf_metrics:
              taskOutputArtifact:
                outputArtifactKey: metrics_json
                producerTask: evaluate-model-2
            rf_model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-2
            rf_plots:
              taskOutputArtifact:
                outputArtifactKey: plots
                producerTask: evaluate-model-2
            rf_portable_model:
              taskOutputArtifact:
                outputArtifactKey: portable_model
                producerTask: train-model-2
            rf_report:
              taskOutputArtifact:
                outputArtifactKey: report
                producerTask: evaluate-model-2
          parameters:
            data_bucket:
              componentInputParameter: data_bucket
            lr_c:
              componentInputParameter: lr_c
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            minio_session_token:
              componentInputParameter: minio_session_token
            output_bucket:
              componentInputParameter: output_bucket
            pipeline_name:
              runtimeValue:
                constant: smart-cities-auto-correction-classifier
            random_state:
              componentInputParameter: random_state
            rf_max_depth:
              componentInputParameter: rf_max_depth
            rf_n_estimators:
              componentInputParameter: rf_n_estimators
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
            test_object:
              componentInputParameter: test_object
            train_object:
              componentInputParameter: train_object
        taskInfo:
          name: publish-results
      train-model:
